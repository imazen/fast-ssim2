[package]
name = "fast-ssim2-cli"
version = "0.7.0"
edition = "2024"
description = "CLI for the fast-ssim2 (SSIMULACRA2) image quality metric"
repository = "https://github.com/imazen/fast-ssim2"
homepage = "https://github.com/imazen/fast-ssim2"
license = "BSD-2-Clause"

# When changing MSRV: Also update .github/workflows/rust.yml
rust-version = "1.85"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[dependencies]
anyhow = "1.0.104"
av-metrics-decoders = { version = "0.3.2", features = [
    "vapoursynth",
    "y4m",
], optional = true }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
indicatif = "0.18.6"
num-traits = { version = "0.2.19", optional = true }
fast-ssim2 = { path = "../fast-ssim2", version = "0.9.0", default-features = false }
yuvxyb = "0.5.0"
statrs = { version = "0.19.1", optional = true }

[dependencies.image]
version = "0.25.10"
default-features = false
features = ["png", "jpeg", "webp", "hdr", "exr"]

[dependencies.plotters]
version = "0.3.7"
default-features = false
features = ["bitmap_backend", "area_series", "ttf"]
optional = true

[features]
default = ["avif"]
video = ["av-metrics-decoders", "plotters", "statrs", "num-traits"]  # requires vapoursynth
avif = ["image/avif"]  # pure-Rust, no libdav1d dependency

[lints.clippy]
uninlined_format_args = "allow"
