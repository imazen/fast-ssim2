[package]
name = "fast-ssim2"
version = "0.8.2"
edition = "2024"
description = "Fast SSIMULACRA2 image quality metric with SIMD acceleration"
repository = "https://github.com/imazen/fast-ssim2"
homepage = "https://github.com/imazen/fast-ssim2"
documentation = "https://docs.rs/fast-ssim2"
readme = "../README.crates.md"
exclude = [
    "test_data",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]
license = "BSD-2-Clause"
keywords = ["image", "quality", "ssim", "ssimulacra2", "perceptual"]
categories = ["multimedia::images", "algorithms"]

# When changing MSRV: Also update README and .github/workflows/rust.yml
rust-version = "1.89.0"

[dependencies]
archmage = { version = "0.9.17", features = ["macros"] }
enough = "0.4.4"
imgref = { version = "1.12", optional = true }
magetypes = { version = "0.9.17" }
num-traits = "0.2.15"
rayon = { version = "1.5.3", optional = true }
thiserror = "2.0.18"
linear-srgb = { version = "0.6.7", default-features = false, features = ["transfer"] }
bytemuck = { version = "1.25", default-features = false }
zenpixels = { version = ">=0.2.16, <0.4.0", default-features = false, features = ["imgref"], optional = true }

[dev-dependencies]
almost-enough = "0.4.4"
image = "0.25.10"
rand = "0.10"
chrono = "0.4"
png = "0.18"
which = "8.0"
sha2 = "0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
zenjpeg = { path = "../../zenjpeg/zenjpeg" }
enough = "0.4.4"
iai-callgrind = "0.16.1"
# `testable_dispatch` lets benches/tier_isolation.rs disable the baseline SIMD
# token (NEON on aarch64) so the scalar arm is real rather than a second
# measurement of the SIMD path.
archmage = { version = "0.9.17", features = ["std", "macros", "testable_dispatch"] }

[features]
default = []
imgref = ["dep:imgref"]  # Support for imgref image types
zenpixels = ["dep:zenpixels"]  # PixelSlice/PixelBuffer inputs via ZenpixelsSource
rayon = ["dep:rayon"]

[[example]]
name = "mem_strip"
required-features = ["imgref"]

[[example]]
name = "obench"
required-features = ["imgref"]

[[example]]
name = "orfcmp"
required-features = ["imgref"]

[[example]]
name = "permute_score"
required-features = ["imgref"]

[[example]]
name = "precompute_benchmark"
required-features = ["imgref"]

[[example]]
name = "sweep_bench"
required-features = ["imgref"]

[[bench]]
name = "pipeline_iai"
harness = false

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "tier_isolation"
harness = false

[lints.clippy]
uninlined_format_args = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("avx512"))'] }

