[package]
name = "fast-ssim2"
version = "0.8.2"
edition = "2024"
description = "Fast SSIMULACRA2 image quality metric with SIMD acceleration"
repository = "https://github.com/imazen/fast-ssim2"
homepage = "https://github.com/imazen/fast-ssim2"
documentation = "https://docs.rs/fast-ssim2"
readme = "../README.crates.md"
exclude = [
    "test_data",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]
license = "BSD-2-Clause"
keywords = ["image", "quality", "ssim", "ssimulacra2", "perceptual"]
categories = ["multimedia::images", "algorithms"]

# When changing MSRV: Also update README and .github/workflows/rust.yml
rust-version = "1.89.0"

[dependencies]
archmage = { version = "0.9.17", features = ["macros"] }
enough = "0.4.4"
imgref = { version = "1.12.3", optional = true }
magetypes = { version = "0.9.17" }
num-traits = "0.2.19"
rayon = { version = "1.12.0", optional = true }
thiserror = "2.0.20"
yuvxyb = "0.5.0"

[build-dependencies.yuvxyb-math]
version = "0.1.1"

[dev-dependencies]
almost-enough = "0.4.4"
image = "0.25.10"
rand = "0.10.2"
chrono = "0.4.45"
png = "0.18.1"
which = "8.0.6"
sha2 = "0.11.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
# `testable_dispatch` lets benches/tier_isolation.rs disable the baseline SIMD
# token (NEON on aarch64) so the scalar arm is real rather than a second
# measurement of the SIMD path.
archmage = { version = "0.9.17", features = ["std", "macros", "testable_dispatch"] }

[features]
default = []
imgref = ["dep:imgref"]  # Support for imgref image types
rayon = ["dep:rayon"]
# Experimental HDR scoring: PU21 (banding_glare) replaces the cube-root opsin
# nonlinearity; input is absolute-luminance linear RGB (cd/m²). See pu_xyb.rs
# + imazen/zenmetrics#25. Off by default; no effect on the standard pipeline.
hdr-pu = []

[[example]]
name = "upiq_pu_score"
required-features = ["hdr-pu"]

[[bench]]
name = "benches"
harness = false

[[bench]]
name = "tier_isolation"
harness = false

[lints.clippy]
uninlined_format_args = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("avx512"))'] }

[[bench]]
name = "kernel_tiers"
harness = false
