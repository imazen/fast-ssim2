[workspace]
resolver = "2"
members = ["fast-ssim2", "ssimulacra2_bin"]
# apidoc/ is the CI-free public-API snapshot runner (its own tiny package, see
# apidoc/Cargo.toml); excluded so plain `cargo test` and CI never build it.
exclude = ["compare_tool", "apidoc"]

[profile.release]
lto = "thin"
codegen-units = 1

# Prevent debug mode from being unusably slow
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 2

[patch.crates-io]
# zenanalyze 0.2.0 isn't on crates.io — zenjpeg resolves it via the
# upstream git rev (same pin as zenjpeg's own workspace).
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze" }
