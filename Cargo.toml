[workspace]
resolver = "2"
members = ["fast-ssim2", "ssimulacra2_bin"]
# apidoc/ is the CI-free public-API snapshot runner (its own tiny package, see
# apidoc/Cargo.toml); excluded so plain `cargo test` and CI never build it.
exclude = ["compare_tool", "apidoc"]

[profile.release]
lto = "thin"
codegen-units = 1

# Prevent debug mode from being unusably slow
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 2

[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "83217972759fab02ff530fe50203a0c7fc3282f8" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "9500a8154bbb21a2d71e87019b002bc43a6094f2" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "9500a8154bbb21a2d71e87019b002bc43a6094f2" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "76e9aad431e1faf7782b0654857325246b15c28b" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
